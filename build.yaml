# This file generates the GitHub Actions matrix
# Building two different Corne configurations:
# 1. corne_niceview: Nice!View display, no RGB (original setup)
# 2. corne_rgb: RGB underglow + OLED display
#
---
include:
  # Corne Nice!View Configuration (Original Setup)
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DZMK_CONFIG="${GITHUB_WORKSPACE}/config/keyboards/corne_niceview"
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DZMK_CONFIG="${GITHUB_WORKSPACE}/config/keyboards/corne_niceview"

  # Corne RGB Configuration (RGB + OLED)
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DZMK_CONFIG="${GITHUB_WORKSPACE}/config/keyboards/corne_rgb"
  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DZMK_CONFIG="${GITHUB_WORKSPACE}/config/keyboards/corne_rgb"

  # Settings Reset (utility)
  - board: nice_nano_v2
    shield: settings_reset
