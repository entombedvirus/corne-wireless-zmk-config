# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - display_name: Typeractive Corne Left
    artifact_name: typeractive_corne_left.uf2
    board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DZMK_CONFIG="${base_dir}/config/keyboards/corne-typeractive"
  - display_name: Typeractive Corne Right
    artifact_name: typeractive_corne_right.uf2
    board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DZMK_CONFIG="${base_dir}/config/keyboards/corne-typeractive"

  - display_name: PandaKB Corne Left
    artifact_name: pandakb_corne_left.uf2
    board: nice_nano_v2
    shield: corne_left corne_pandakb nice_oled
    cmake-args: -DZMK_CONFIG="${base_dir}/config/keyboards/corne-pandakb"
  - display_name: PandaKB Corne Right
    artifact_name: pandakb_corne_right.uf2
    board: nice_nano_v2
    shield: corne_right corne_pandakb nice_oled
    cmake-args: -DZMK_CONFIG="${base_dir}/config/keyboards/corne-pandakb"

  - display_name: Prospector Dongle
    artifact_name: prospector_dongle.uf2
    board: seeeduino_xiao_ble
    shield: corne_dongle prospector_adapter
    cmake-args: -DZMK_CONFIG="${base_dir}/config/dongles/prospector"
  - display_name: Prospector Dongle Settings Reset
    artifact_name: prospector_dongle_reset.uf2
    board: seeeduino_xiao_ble
    shield: settings_reset
    cmake-args: -DZMK_CONFIG="${base_dir}/config/keyboards/corne-pandakb"

  # firware to wipe flash memory. works for both typeractive and pandakb
  - display_name: Corne Settings Reset
    artifact_name: corne_reset.uf2
    board: nice_nano_v2
    shield: settings_reset
