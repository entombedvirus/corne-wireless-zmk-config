# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - name: typeractive_corne_left
    board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
  - name: typeractive_corne_right
    board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
  - name: typeractive_corne
    board: nice_nano_v2
    shield: settings_reset

  - name: panda_corne_left
    board: nice_nano_v2
    shield: corne_left nice_oled
    cmake-args: "-DZMK_CONFIG_OVERLAY_FILE=${ZEPHYR_BASE}/../config/panda.conf"
  - name: panda_corne_right
    board: nice_nano_v2
    shield: corne_right nice_oled
    cmake-args: "-DZMK_CONFIG_OVERLAY_FILE=${ZEPHYR_BASE}/../config/panda.conf"
