# Corne from Typeractive

# Device Name
CONFIG_ZMK_KEYBOARD_NAME="RohKeeb"

# Bluetooth settings
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Debounce settings
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio settings
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Mouse/pointing device support
CONFIG_ZMK_POINTING=y

# Enable display support for Nice!View
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Note: RGB is NOT enabled since this keyboard doesn't have LEDs

# Optional: Deep sleep (uncomment if desired)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Optional: USB logging (uncomment for debugging)
# CONFIG_ZMK_USB_LOGGING=y
